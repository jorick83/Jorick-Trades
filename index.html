<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jorick Trades | Volume Profile Journal</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <script src="./sync-config.js"></script>
    <script defer src="./sync.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-J3Vnt_Z4.css">
  </head>
  <body>
    <div id="sync-root" style="min-height:100vh;display:grid;place-items:center;background:#090e1a;color:#e5efff;font-family:system-ui;padding:24px">
      <form id="sync-login" style="width:min(100%,390px);display:grid;gap:14px;background:#111c30;border:1px solid #264c7c;border-radius:18px;padding:26px">
        <img src="./logo.png" alt="Jorick" style="width:160px;max-width:100%;margin:auto" />
        <h1 style="font-size:22px;text-align:center;margin:0">Jorick Trades</h1>
        <p style="margin:0;color:#abc4e8;text-align:center">Logga in för att synkronisera din tradingjournal.</p>
        <label>E-post
          <span style="display:flex;gap:8px;margin-top:6px">
            <input name="email" type="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Ange din e-postadress" aria-label="E-postadress" style="flex:1;min-width:0;box-sizing:border-box;padding:12px;border-radius:8px;background:#080f1e;color:white;border:1px solid #52709b" />
          </span>
        </label>
        <label>Lösenord<input name="password" type="password" required autocomplete="current-password" style="display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border-radius:8px;background:#080f1e;color:white;border:1px solid #52709b" /></label>
        <label style="display:flex;align-items:center;gap:9px;font-size:14px;color:#c8d9f3"><input name="remember" type="checkbox" checked style="accent-color:#1678dd;width:17px;height:17px" /> Håll mig inloggad på den här enheten</label>
        <button type="submit" style="padding:12px;border:0;border-radius:8px;background:#1678dd;color:white;font-weight:bold;cursor:pointer">Logga in</button>
        <p id="sync-status" role="status" style="margin:0;font-size:13px;overflow-wrap:anywhere"></p>
      </form>
    </div>
    <div id="sync-bar" hidden style="position:fixed;bottom:10px;right:10px;z-index:99999;background:#101e35;color:#e5efff;padding:10px 12px;border:1px solid #3263a4;border-radius:10px;font:12px system-ui;max-width:calc(100vw - 20px)">
      <span id="sync-bar-text">Molnsynkronisering aktiv</span>
      <button id="sync-retry" style="margin-left:8px">Försök igen</button>
      <button id="sync-reload">Hämta senaste</button>
      <button id="sync-logout">Logga ut</button>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const root = document.getElementById('root');
        const base = new URL('./', window.location.href);
        const logoUrl = new URL('logo.png', base).href;
        const certificateUrl = new URL('certificates/iq-capital-50k.jpg', base).href;
        const fixImages = () => {
          const header = root.querySelector('header');
          if (header) {
            for (const img of header.querySelectorAll('img')) {
              if (/logo|jorick/i.test(img.alt || '') && img.src !== logoUrl) {
                img.src = logoUrl;
                img.style.objectFit = 'contain';
              }
            }
          }
          for (const img of root.querySelectorAll('img')) {
            if (/iq capital challenge passed/i.test(img.alt || '') && img.src !== certificateUrl) {
              img.src = certificateUrl;
              img.style.maxWidth = '100%';
              img.style.height = 'auto';
            }
          }
        };
        new MutationObserver(fixImages).observe(root, {childList:true,subtree:true});
        fixImages();
      })();
    </script>

    <script>
      (() => {
        // Keep the original journal and its data intact; replace only the Reviews presentation.
        const root = document.getElementById('root');
        function mountCoach() {
          const tabs = [...root.querySelectorAll('[role="tab"]')];
          // Remove the calculator from the visible journal navigation.
          for (const tab of tabs) {
            const value = (tab.getAttribute('data-value') || '').toLowerCase();
            const label = tab.textContent.trim().toLowerCase();
            if (['calculator','calc','ib-calculator','ibcalculator'].includes(value) || /calculator|kalkylator/.test(label)) {
              if (tab.getAttribute('aria-selected') === 'true') {
                const fallback = tabs.find(t => t !== tab && !t.hidden && !/calculator|kalkylator/i.test(t.textContent));
                if (fallback) fallback.click();
              }
              if (!tab.hidden) { tab.hidden = true; tab.style.display = 'none'; tab.setAttribute('aria-hidden','true'); tab.tabIndex = -1; }
            }
          }
          const reviewTab = tabs.find(x => x.getAttribute('data-value') === 'reviews' || x.textContent.trim() === 'Reviews' || x.textContent.trim() === 'AI Coach');
          const oldCoachTab = tabs.find(x => x.getAttribute('data-value') === 'coach' || x.textContent.trim() === 'Coach');
          if (oldCoachTab) { oldCoachTab.hidden = true; oldCoachTab.style.display = 'none'; oldCoachTab.setAttribute('aria-hidden','true'); oldCoachTab.tabIndex = -1; }
          if (reviewTab && reviewTab.textContent.trim() !== 'AI Coach') reviewTab.textContent = 'AI Coach';
          const reviewPanel = root.querySelector('[role="tabpanel"][data-value="reviews"], [role="tabpanel"][id$="-content-reviews"]');
          if (!reviewPanel) return;
          if (reviewPanel.querySelector('#integrated-ai-coach')) return;
          const previous = document.createElement('div'); previous.id = 'legacy-review-content';
          while (reviewPanel.firstChild) previous.appendChild(reviewPanel.firstChild);
          previous.hidden = true;
          reviewPanel.appendChild(previous);
          const frame = document.createElement('iframe'); frame.id = 'integrated-ai-coach';
          frame.src = './ai-coach.html?embedded=1&version=20261117-score-v2'; frame.title = 'Jorick Trades AI Coach';
          frame.style.cssText = 'display:block;width:100%;min-height:1100px;border:0;border-radius:12px;background:#090e1a';
          frame.setAttribute('loading','lazy'); reviewPanel.appendChild(frame);
          window.addEventListener('message', e => { if (e.origin !== location.origin || e.data?.type !== 'jorick-ai-coach-height') return; frame.style.height = Math.max(650,Number(e.data.height)||1100)+'px'; }, {passive:true});
        }
        let busy = false;
        new MutationObserver(() => { if(busy)return; busy=true; try{mountCoach()}finally{busy=false} }).observe(root,{childList:true,subtree:true});
        mountCoach();
      })();
    </script>
  </body>
</html>
