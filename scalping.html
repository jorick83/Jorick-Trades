<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momentum Scalping</title><script src="./sync-config.js"></script><style>body{background:#090e1a;color:#e5efff;font:15px system-ui;margin:0;padding:24px}a{color:#8ac7ff}section{background:#111c30;border:1px solid #26405e;border-radius:12px;padding:16px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.metric{padding:12px;background:#17263d;border-radius:8px}.metric b{display:block;font-size:24px}select,button{background:#17263d;color:white;border:1px solid #52709b;padding:9px;border-radius:6px}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{padding:9px;text-align:left;border-bottom:1px solid #30435d}progress{width:100%;height:18px}svg{width:100%;height:180px}pre{white-space:pre-wrap;font:inherit}</style><a href="./">← Volume Profile Journal</a><h1>Momentum Scalping</h1><p id="status">Hämtar journalen…</p><label>Handelsläge <select id="mode"><option>SIM</option><option>Replay</option><option>Live</option></select></label> <label>Konto <select id="account"><option value="">Alla</option></select></label><section><h2>100 SIM-trades</h2><p id="goal"></p><progress id="progress" max="100" value="0"></progress></section><section><h2>Performance</h2><div class="grid" id="metrics"></div><h3>Equity curve</h3><svg id="chart" viewBox="0 0 600 180" preserveAspectRatio="none"></svg></section><section><h2>Scalping Trade Log</h2><div style="overflow:auto"><table><thead><tr><th>Entry</th><th>Exit</th><th>Instrument</th><th>Riktning</th><th>Antal</th><th>Entrypris</th><th>Exitpris</th><th>P/L USD</th></tr></thead><tbody id="rows"></tbody></table></div></section><section><h2>Scalping AI Coach</h2><div id="coach"></div></section><script>
const $=id=>document.getElementById(id), cfg=window.JORICK_SYNC_CONFIG||{}, base=String(cfg.supabaseUrl||'').replace(/\/$/,'');let trades=[],sessions=[];const money=n=>n.toLocaleString('sv-SE',{maximumFractionDigits:2})+' USD';function el(tag,txt){const e=document.createElement(tag);e.textContent=txt;return e}function render(){const t=trades.filter(x=>x.mode===$('mode').value&&(!$('account').value||x.account===$('account').value)).sort((a,b)=>a.exit_dt.localeCompare(b.exit_dt));const sim=trades.filter(x=>x.mode==='SIM'&&(!$('account').value||x.account===$('account').value)).length;$('goal').textContent=sim+' / 100 avslutade SIM-trades';$('progress').value=sim;let p=0,peak=0,dd=0;const eq=[0];for(const x of t){p+=Number(x.profit_loss);peak=Math.max(peak,p);dd=Math.max(dd,peak-p);eq.push(p)}const wins=t.filter(x=>Number(x.profit_loss)>0),loss=t.filter(x=>Number(x.profit_loss)<0),sum=a=>a.reduce((s,x)=>s+Number(x.profit_loss),0),duration=x=>(Date.parse(x.exit_dt)-Date.parse(x.entry_dt))/1000;const metrics=[['Trades',t.length],['P/L (export)',money(p)],['Winrate',t.length?(100*wins.length/t.length).toFixed(1)+' %':'–'],['Profit factor',loss.length?(sum(wins)/-sum(loss)).toFixed(2):wins.length?'∞':'–'],['Expectancy',t.length?money(p/t.length):'–'],['Max drawdown',money(dd)],['Snittvinst',wins.length?money(sum(wins)/wins.length):'–'],['Snittförlust',loss.length?money(sum(loss)/loss.length):'–'],['Tid i trade',t.length?Math.round(t.reduce((s,x)=>s+duration(x),0)/t.length)+' s':'–']];$('metrics').replaceChildren();for(const [k,v] of metrics){const d=el('div',k);d.className='metric';d.append(el('b',v));$('metrics').append(d)}const lo=Math.min(...eq),hi=Math.max(...eq),range=hi-lo||1;const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',eq.map((v,i)=>[10+580*i/Math.max(1,eq.length-1),170-160*(v-lo)/range].join(',')).join(' '));line.setAttribute('fill','none');line.setAttribute('stroke','#55c6a9');line.setAttribute('stroke-width','2');$('chart').replaceChildren(line);$('rows').replaceChildren();for(const x of t.slice().reverse()){const tr=el('tr','');for(const v of [x.entry_dt,x.exit_dt,x.symbol,x.quantity>0?'Long':'Short',Math.abs(x.quantity),x.entry_price,x.exit_price,money(Number(x.profit_loss))])tr.append(el('td',v));$('rows').append(tr)}$('coach').replaceChildren();if(!sessions.length)$('coach').append(el('p','Inga analyser ännu.'));for(const s of sessions){$('coach').append(el('h3',s.session_date+' · '+s.title),el('p',s.summary),el('pre',s.analysis))}}
async function load(){try{const key='jorick-sync-session-v1',storage=localStorage.getItem(key)?localStorage:sessionStorage,s=JSON.parse(storage.getItem(key)||'null');if(!s?.refresh)throw Error('Logga in på startsidan först.');const r=await fetch(base+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:cfg.supabaseAnonKey,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh})});const token=await r.json();if(!r.ok||!token.access_token)throw Error('Logga in igen på startsidan.');storage.setItem(key,JSON.stringify({refresh:token.refresh_token,userId:token.user.id}));const headers={apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+token.access_token};async function get(table,order){let all=[];for(let offset=0;;offset+=500){const res=await fetch(base+'/rest/v1/'+table+'?select=*&order='+order+'&limit=500&offset='+offset,{headers});if(!res.ok)throw Error('Databasfel '+res.status);const rows=await res.json();all.push(...rows);if(rows.length<500)return all}}[trades,sessions]=await Promise.all([get('scalping_trades','exit_dt.asc,id.asc'),get('scalping_coach_sessions','session_date.desc,id.desc')]);for(const a of [...new Set(trades.map(t=>t.account))]){const o=el('option',a);o.value=a;$('account').append(o)}$('status').textContent='Synkroniserad · P/L enligt DeepCharts-export, avgifter ej verifierade';render()}catch(e){$('status').textContent=e.message}}$('mode').onchange=render;$('account').onchange=render;load();
</script></html>
